# Generates repos.json (snapshot of public repositories) so the site
# does not depend on the unauthenticated GitHub API at runtime.
name: update-repos

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repos
  cancel-in-progress: false

jobs:
  update:
    name: Generate repos.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/users/0ldskoolerz/repos?sort=updated&per_page=100',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'update-repos-workflow',
              })
          repos = json.load(urllib.request.urlopen(req))
          keep = ('name', 'description', 'html_url', 'homepage', 'language',
                  'stargazers_count', 'forks_count', 'topics', 'updated_at')
          data = [{k: r.get(k) for k in keep}
                  for r in repos if not r.get('fork') and not r.get('archived')]
          with open('repos.json', 'w', encoding='utf-8') as f:
              f.write(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          print('repos.json written:', len(data), 'repositories')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          if git diff --cached --quiet; then
            echo "repos.json up to date"
          else
            git commit -m "chore: update repos.json"
            git push
          fi
